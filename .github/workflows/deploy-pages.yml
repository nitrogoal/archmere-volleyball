name: Deploy site

# Publishes dist/ to GitHub Pages after the data checks pass.
# Also called by the updater right after it commits new data.
on:
  push:
    branches: [main]
    paths: ['dist/**', 'players.json', 'corrections.json', 'scripts/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dist/app.js
      - run: node scripts/test-update-results.mjs
      - run: node scripts/test-sync-source.mjs
      - run: node scripts/update-results.mjs --validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
